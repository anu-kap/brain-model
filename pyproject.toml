[project]
name = "brainengage"
version = "0.1.0"
description = "Do TRIBE v2 predicted-brain features add engagement-prediction value beyond their own inputs? (SnapUGC POC)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "pyyaml>=6",
  "requests>=2.31",
  "tqdm>=4.66",
  "av>=13",
  "pillow>=10",
  "imagehash>=4.3",
  "nilearn>=0.10.4",
  "nibabel>=5.2",
  "gdown>=5",
]

[project.optional-dependencies]
# GPU extraction environment (Lightning AI L4 Studio). Not installable on macOS.
gpu = [
  "tribev2 @ git+https://github.com/facebookresearch/tribev2.git",
  "exca>=0.5.20,<0.5.26",
  "torch>=2.5.1,<2.7",
  "torchvision>=0.20,<0.22",
  "mne>=1.7",
  "huggingface_hub[cli]",
]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
